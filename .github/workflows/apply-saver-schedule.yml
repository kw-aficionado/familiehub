name: Apply and verify screensaver hours
on:
  push:
    branches: [feature/screensaver-hours-20261102]
    paths:
      - scripts/apply_saver_schedule.py
      - scripts/saver_controller.txt
      - .github/workflows/apply-saver-schedule.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact source edits
        run: python3 scripts/apply_saver_schedule.py
      - name: Verify complete application and browser behavior
        run: |
          git diff --check
          for file in web/*.js; do node --check "$file"; done
          node --test tests/*.test.js
          go test ./...
          go test -race ./...
      - name: Commit verified application files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js web/index.html
          git commit -m 'Wire configurable 20:00-07:00 screensaver hours into display settings'
          git push origin HEAD:feature/screensaver-hours-20261102
