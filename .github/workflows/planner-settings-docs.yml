name: Align planner save instructions
on:
  push:
    branches: [ui/planner-under-task-archive-20261103]
permissions:
  contents: write
jobs:
  docs:
    if: github.event.head_commit.message == 'Align planner settings documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/planner-under-task-archive-20261103
      - name: Update the saved-plan navigation instructions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          before = 'Efter godkendelse åbner FamilieHub automatisk **startugen** og viser en kvittering med antallet af gemte opgaver.'
          after = 'Efter godkendelse bliver du i **Indstillinger** og ser en kvittering med antallet af gemte opgaver. Klik **Se den gemte opgaveplan** for at åbne planens **startuge** under Opgaver.'
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          text = text.replace('\\n\\nBemærk: En plan opretter', '\n\nBemærk: En plan opretter', 1)
          path.write_text(text)
          PY
          git diff --check
          node --test tests/*.test.js
      - name: Commit only the documentation correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Describe the saved-plan link from Settings accurately'
          git push origin HEAD:ui/planner-under-task-archive-20261103
