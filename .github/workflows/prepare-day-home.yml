name: Prepare and verify day home
on:
  push:
    branches: [feature/day-home-and-daily-tasks]
    paths: [.github/workflows/prepare-day-home.yml, .github/apply-day-home.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/day-home-and-daily-tasks
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact frontend changes
        run: python3 .github/apply-day-home.py
      - name: Verify navigation and existing behavior
        run: |
          git diff --check
          for file in web/*.js; do node --check "$file"; done
          node --test tests/*.test.js
          go test ./...
          go test -race ./...
      - name: Commit verified application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js web/index.html web/style.css README.md
          git commit -m 'Default to day view and open the complete daily checklist'
          git push origin HEAD:feature/day-home-and-daily-tasks
