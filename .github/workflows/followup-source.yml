name: Isolated followup source snapshot
on:
  push:
    branches: [feature/task-followup-20261118]
    paths: [.github/workflows/followup-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Bundle tracked source and public dependencies
        run: |
          mkdir -p /tmp/followup-source
          git archive HEAD | tar -x -C /tmp/followup-source
          cd /tmp/followup-source
          go mod vendor
          tar -czf /tmp/followup-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: followup-source
          path: /tmp/followup-source.tar.gz
          retention-days: 2
