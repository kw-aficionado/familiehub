name: Verify shared chore planning and safe cleanup
on:
  push:
    branches: [fix/rotation-quickstart-calendar-settings-20261116]
    paths: [.github/workflows/apply-planning-update.yml]
permissions:
  contents: write
concurrency:
  group: planning-feature-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-quickstart-calendar-settings-20261116
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Serialize completion and retirement in the same transaction domain
        run: |
          if git apply --check .github/completion-atomic.patch; then
            git apply .github/completion-atomic.patch
          else
            git apply --reverse --check .github/completion-atomic.patch
          fi
          go test ./...
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.go
          if ! git diff --cached --quiet; then
            git commit -m 'Make checkmarks atomic with retirement and preserve history under concurrent requests'
            git push origin HEAD:fix/rotation-quickstart-calendar-settings-20261116
          fi
      - name: Install isolated browser verification tools
        run: |
          python -m pip install -r scripts/screenshots-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise actual browser planning and safe retirement
        run: python scripts/test-planning-browser.py --artifacts /tmp/familiehub-browser-review
      - name: Refresh documentation using fictional local data only
        run: python scripts/capture-screenshots.py
      - name: Run complete unit integration race and frontend checks
        run: sh scripts/check.sh
      - name: Commit verified documentation screenshots
        run: |
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'Verify final planning and history safeguards with current fictional screenshots'
            git push origin HEAD:fix/rotation-quickstart-calendar-settings-20261116
          fi
      - name: Retain fictional browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-browser-review
          path: |
            /tmp/familiehub-browser-review
            docs/screenshots
          retention-days: 3
