name: Apply and verify planner start date feature
on:
  push:
    branches: [feature/planner-start-date-favicon]
    paths:
      - .github/workflows/apply-planner-start-date.yml
      - .github/planner-start-feature.zip
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/planner-start-date-favicon
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply exact source edits and icon assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          payload=Path('.github/planner-start-feature.zip')
          assert hashlib.sha256(payload.read_bytes()).hexdigest()=='182549c64ee5854b3cec5153e4ca6a1b34a518dd792fc54b4188e6af92e7eb8f'
          allowed={'apply_feature.py','docs/PLANNER-START.md','internal/mcpaccess/start_date_test.go','planner_start_date.go','planner_start_date_test.go','tests/planner_dates.test.js','web/apple-touch-icon.png','web/favicon.ico','web/planner-dates.js'}
          with zipfile.ZipFile(payload) as z:
              assert set(z.namelist())==allowed
              for name in z.namelist():
                  dest=Path(name)
                  assert not dest.exists(), 'Refusing to overwrite '+name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          PY
          python3 apply_feature.py
          rm apply_feature.py
          git checkout -- .github/workflows/ci.yml
      - name: Verify final source and assets
        run: |
          git diff --check
          for file in web/*.js; do node --check "$file"; done
          node --test tests/planner_dates.test.js
          go test ./...
      - name: Commit verified application files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support explicit planner start dates and reuse the house icon as favicon'
          git push origin HEAD:feature/planner-start-date-favicon
