name: Verify task followup and adult review
on:
  push:
    branches: [feature/task-followup-20261118]
    paths: [.github/workflows/verify-followup.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task-followup-20261118
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified candidate with preimage guards
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/followup-transfer-{i}.b64').read_text().strip() for i in range(1,7))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '919d6febde69a2c835ab2b97225fc68718ac8282cc6d5a8c7fdfc203bdb95168', 'Source checksum mismatch'
          if not Path('followup.go').exists():
              subprocess.run(['git','apply','--check','-'], input=patch, check=True)
              subprocess.run(['git','apply','-'], input=patch, check=True)
          PY
      - name: Verify backend and browser syntax
        run: |
          go test -timeout 5m ./...
          for file in web/*.js; do node --check "$file"; done
      - name: Install isolated browser tools
        run: |
          python -m pip install -r scripts/screenshots-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise actual followup and tablet permission workflow
        run: python scripts/test-followup-browser.py --artifacts /tmp/followup-review
      - name: Preserve existing tablet and planning workflows
        run: |
          python scripts/test-tablet-browser.py
          python scripts/test-planning-browser.py
      - name: Capture current documentation using fictional data
        run: python scripts/capture-screenshots.py
      - name: Complete unit integration race and frontend verification
        run: sh scripts/check.sh
      - name: Commit verified application and screenshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md ai.go chore_templates.go docs/CODEX.md docs/FOLLOWUP.md docs/SCREENSHOTS.md docs/TABLETS.md docs/screenshots followup.go followup_test.go integrations.go internal/mcpaccess/tools.go internal/store/sqlite.go main.go plan_persistence.go schedule.go scripts/capture-screenshots.py scripts/test-followup-browser.py tablets.go task_completion.go tests/documentation.test.js tests/followup.test.js web/app.js web/followup-ui.js web/index.html web/style.css web/tablet-admin.js web/tablet.html web/tablet.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add auditable missed chore followup, adult decisions and scoped tablet resolution'
            git push origin HEAD:feature/task-followup-20261118
          fi
      - name: Retain fictional browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-browser-review
          path: |
            /tmp/followup-review/*.png
            docs/screenshots/*.webp
            docs/screenshots/manifest.json
          retention-days: 3
