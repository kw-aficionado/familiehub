name: Verify automatic Copenhagen day rollover
on:
  push:
    branches: [fix/automatic-day-rollover-20261123]
    paths: [.github/workflows/verify-midnight.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-day-rollover-20261123
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed checksum-verified source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          text = ''.join(Path(f'.github/midnight-transfer-{i}.b64').read_text().strip() for i in range(1, 4))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9a4204334262bbbd878c7690a413f6898aaa2d4399f36c0260e502ab67474b94', 'Source checksum mismatch'
          if not Path('web/day-rollover.js').exists():
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Verify JavaScript and backend
        run: |
          go test -timeout 5m ./...
          node --test tests/*.test.js
          for file in web/*.js; do node --check "$file"; done
      - name: Install isolated browser verification
        run: |
          python -m pip install -r scripts/screenshots-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise actual midnight and wake behavior
        run: python scripts/test-midnight-browser.py --artifacts /tmp/midnight-review
      - name: Preserve tablet pairing, followup and planning
        run: |
          python scripts/test-tablet-browser.py
          python scripts/test-followup-browser.py
          python scripts/test-planning-browser.py
      - name: Capture documentation using fictional data
        run: python scripts/capture-screenshots.py
      - name: Complete unit integration race and frontend checks
        run: sh scripts/check.sh
      - name: Commit verified application and documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md docs/CODEX.md docs/MIDNIGHT.md docs/screenshots scripts/test-midnight-browser.py tests/day_navigation.test.js tests/day_rollover.test.js web/app.js web/day-rollover.js web/index.html web/tablet.html web/tablet.js
          if ! git diff --cached --quiet; then
            git commit -m 'Switch live family views at Copenhagen midnight without losing drafts or sessions'
            git push origin HEAD:fix/automatic-day-rollover-20261123
          fi
      - name: Retain fictional browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-browser-review
          path: |
            /tmp/midnight-review/*.png
            docs/screenshots/*.webp
            docs/screenshots/manifest.json
          retention-days: 3
