name: Apply and verify planner settings relocation
on:
  push:
    branches: [ui/planner-under-task-archive-20261103]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply planner settings relocation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/planner-under-task-archive-20261103
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Move planner below the task archive
        run: python3 .github/move_planner_settings.py
      - name: Verify application and planner navigation
        run: |
          git diff --check
          for file in web/*.js; do node --check "$file"; done
          node --test tests/*.test.js
          go test ./...
          go test -race ./...
      - name: Commit verified UI and documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/app.js README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Move AI planner to Settings below the task archive'
          git push origin HEAD:ui/planner-under-task-archive-20261103
