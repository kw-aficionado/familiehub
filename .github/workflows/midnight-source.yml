name: Isolated midnight rollover source
on:
  push:
    branches: [fix/automatic-day-rollover-20261123]
    paths: [.github/workflows/midnight-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0229c81648a40bb48f1eab067438170852175eb
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/familiehub-midnight-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-source
          path: /tmp/familiehub-midnight-source.tar.gz
          retention-days: 2
