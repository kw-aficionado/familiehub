name: Capture and verify current documentation
on:
  push:
    branches: [docs/current-screenshots-codex-20261104]
    paths:
      - scripts/capture-screenshots.py
      - scripts/screenshots-requirements.txt
      - .github/workflows/refresh-demo-screenshots.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-screenshots-codex-20261104
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check development setup
        run: sh scripts/setup-dev.sh
      - name: Install optional screenshot tooling
        run: |
          python -m pip install -r scripts/screenshots-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Align the documented planner navigation with existing regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = 'Åbn **Indstillinger → AI Opgaveplanlægger**, direkte under **Opgavearkiv**.'
          new = 'Åbn **Indstillinger**, og find **AI Opgaveplanlægger** lige under **Opgavearkiv**.'
          assert text.count(old) == 1 or new in text
          path.write_text(text.replace(old, new))
          PY
      - name: Capture the real app with temporary fictional data
        run: python scripts/capture-screenshots.py
      - name: Verify tests, screenshot provenance, docs and build
        run: |
          sh scripts/check.sh
          python -m py_compile scripts/capture-screenshots.py
      - name: Commit verified documentation images only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh real-app demo screenshots and document their provenance'
          git push origin HEAD:docs/current-screenshots-codex-20261104
