<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182d39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FamilieHub</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<section id="login" class="login-screen hidden">
 <div class="login-card">
  <div class="logo">⌂</div>
  <h1>FamilieHub</h1><p>Familiens fælles overblik</p>
  <form id="loginForm"><label for="password">Adgangskode</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><button type="submit" class="primary wide">Log ind</button></form>
  <p id="loginError" class="error" aria-live="polite"></p>
 </div>
</section>
<main id="app" class="app hidden">
 <header class="topbar">
  <div class="brand"><span class="brand-icon">⌂</span><div><strong>FamilieHub</strong><small>Familiens overblik</small></div></div>
  <div class="top-actions"><span id="connection" class="connection">● Online</span><button id="peopleBtn" class="icon-button" aria-label="Administrer familien" title="Familiemedlemmer">♧</button><button id="logoutBtn" class="icon-button" title="Log ud" aria-label="Log ud">⇥</button></div>
 </header>
 <div id="warning" class="warning hidden"></div>
 <section class="intro"><div><div id="currentDate" class="eyebrow"></div><h1 id="viewTitle">Familiekalender</h1></div><button class="primary" id="addEventBtn">+ Ny aftale</button></section>
 <nav class="navigation" aria-label="Kalendervisning">
  <div class="views"><button id="dayBtn" class="segment">Dag</button><button id="weekBtn" class="segment active">Uge</button></div>
  <div class="date-navigation"><button id="prevBtn" class="icon-button" aria-label="Forrige">‹</button><button id="todayBtn" class="minor">I dag</button><button id="nextBtn" class="icon-button" aria-label="Næste">›</button></div>
 </nav>
 <section id="peopleFilters" class="filters" aria-label="Filtrer efter familiemedlem"></section>
 <section id="calendar" class="calendar" aria-label="Kalender"></section>
 <section class="below">
  <article class="panel tasks-panel"><div class="panel-title"><div><h2>Pligter</h2><p id="taskDate"></p></div><button id="addTaskBtn" class="minor">+ Opgave</button></div><div id="taskList"></div></article>
  <article class="panel status-panel"><div class="panel-title"><h2>Familien i dag</h2><button id="settingsBtn" class="minor">Opsætning</button></div><div id="todayList"></div><p class="muted footnote">Personlige påmindelser sendes via Home Assistant, når det er konfigureret.</p></article>
 </section>
 <footer>FamilieHub · Europa/København · <span id="updated">Ikke opdateret</span></footer>
</main>
<div id="modal" class="modal-layer hidden" role="presentation"><div class="modal-backdrop" data-close="1"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="dialog-head"><h2 id="modalTitle"></h2><button class="icon-button" id="closeModal" aria-label="Luk">×</button></header><div id="modalBody"></div><p id="formError" class="error" aria-live="polite"></p></section></div>
</body>
</html>
